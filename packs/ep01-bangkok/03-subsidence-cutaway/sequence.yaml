title: "Subterranean Clay Compaction"
canvas:
  width: 3840
  height: 2160
bounds: [100.0, 13.0, 101.0, 14.0]
background: "#181a1f"
fps: 10
duration_seconds: 8.0
layers:
  - id: sand-aquifer-layer
    kind: polygon
    fill: "#334155"
    stroke: "#1e293b"
    stroke_width: 8
    lift: 4
    points: [[200, 1500], [3640, 1500], [3640, 2080], [200, 2080]]
    sources: [jica-bangkok-groundwater-1999]
  - id: stiff-clay-layer
    kind: polygon
    fill: "#475569"
    stroke: "#334155"
    stroke_width: 8
    lift: 8
    points: [[200, 1050], [3640, 1050], [3640, 1500], [200, 1500]]
    sources: [jica-bangkok-groundwater-1999]
  - id: soft-clay-layer
    kind: polygon
    fill: "#78716c"
    stroke: "#57534e"
    stroke_width: 8
    lift: 12
    points: [[200, 680], [3640, 680], [3640, 1050], [200, 1050]]
    sources: [chula-subsidence-study-2020]
  - id: surface-ground-layer
    kind: polygon
    fill: "#a8a29e"
    stroke: "#78716c"
    stroke_width: 6
    lift: 14
    points: [[200, 640], [3640, 640], [3640, 680], [200, 680]]
    sources: [chula-subsidence-study-2020]
  - id: river-high-tide
    kind: polygon
    fill: "#2563eb"
