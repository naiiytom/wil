    y: 420
    sources: [chula-subsidence-study-2020]
scenes:
  - id: groundwater-extraction
    start: 0.0
    end: 4.0
  - id: clay-compaction-subsidence
    start: 4.0
    end: 8.0
animations:
  - layer: soft-clay-layer
    translate:
      y: [{at: 0.0, value: 0.0}, {at: 4.0, value: 0.0}, {at: 8.0, value: 140.0}]
  - layer: surface-ground-layer
    translate:
      y: [{at: 0.0, value: 0.0}, {at: 4.0, value: 0.0}, {at: 8.0, value: 140.0}]
  - layer: settling-building
    translate:
      y: [{at: 0.0, value: 0.0}, {at: 4.0, value: 0.0}, {at: 8.0, value: 140.0}]
assume_crs: EPSG:4326
