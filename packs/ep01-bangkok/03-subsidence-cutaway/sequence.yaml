    kind: line
    stroke: "#ef4444"
    stroke_width: 8
    lift: 18
    points: [[200, 640], [3640, 640]]
    sources: [chula-subsidence-study-2020]
  - id: skyscraper-deep-piles
    kind: line
    stroke: "#cbd5e1"
    stroke_width: 24
    lift: 20
    points: [[1260, 640], [1260, 1600], [1440, 1600], [1440, 640]]
    sources: [jica-bangkok-groundwater-1999]
  - id: skyscraper-building
    kind: polygon
    fill: "#f8fafc"
    stroke: "#94a3b8"
    stroke_width: 8
    lift: 24
    points: [[1200, 200], [1500, 200], [1500, 640], [1200, 640]]
    sources: [jica-bangkok-groundwater-1999]
  - id: settling-building
    kind: polygon
    fill: "#e2e8f0"
    stroke: "#94a3b8"
    stroke_width: 6
    lift: 22
    points: [[2200, 460], [2600, 460], [2600, 640], [2200, 640]]
