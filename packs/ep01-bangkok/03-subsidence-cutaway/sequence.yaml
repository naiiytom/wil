  - id: deep-extraction-well
    kind: line
    stroke: "#f59e0b"
    stroke_width: 14
    lift: 18
    points: [[3000, 500], [3000, 1800]]
    sources: [jica-bangkok-groundwater-1999]
labels:
  - text: "CHAO PHRAYA HIGH TIDE LEVEL"
    x: 240
    y: 480
    sources: [chula-subsidence-study-2020]
  - text: "HISTORICAL GROUND LEVEL (1960 DATUM)"
    x: 1700
    y: 610
    sources: [chula-subsidence-study-2020]
  - text: "COMPRESSIBLE SOFT BANGKOK CLAY (15-30m)"
    x: 1600
    y: 860
    sources: [chula-subsidence-study-2020]
  - text: "STIFF CLAY STRATUM"
    x: 1600
    y: 1280
    sources: [jica-bangkok-groundwater-1999]
  - text: "DEEP SAND AQUIFER (GROUNDWATER PUMPING)"
    x: 1400
    y: 1800
    sources: [jica-bangkok-groundwater-1999]
  - text: "DEEP PILES ANCHORED IN STIFF STRATA"
    x: 1040
    y: 160
    sources: [jica-bangkok-groundwater-1999]
  - text: "SHALLOW FOUNDATION SINKS WITH COMPACTING CLAY"
